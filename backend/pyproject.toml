[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    "node_modules",
    ".angular",
    "www",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "B", "S"]
ignore = [
    "B008",  # Inyección de dependencias en defaults de FastAPI (Depends, Query, File)
    "S105",  # Falso positivo: token_type="bearer" en esquemas OAuth2
    "S106",  # Falso positivo: token_type="bearer" en respuestas OAuth2
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # Uso legítimo de assert en pruebas unitarias con pytest
    "E501",  # Preservación de pruebas originales intactas según Regla General 2
]
